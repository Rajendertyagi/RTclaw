name: Release Portable Desktop

on:
  push:
    tags:
      - "portable-v*"
      - "portable-latest"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave blank for auto build timestamp)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Python (for bootstrapping embeddable)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm

      - name: Install MinGW (for CGo / webview2)
        shell: bash
        run: choco install mingw -y --no-progress

      - name: Add Go dependencies
        shell: bash
        run: |
          go get github.com/webview/webview_go@latest
          go get github.com/energye/systray@latest
          go get github.com/pkg/browser@latest

      - name: Build web UI
        shell: bash
        run: |
          cd ui/web
          pnpm install --frozen-lockfile && pnpm build && cd ../..
          mkdir -p internal/webui/dist
          cp -r ui/web/dist/* internal/webui/dist/

      - name: Build GoClaw Standard server (with embedded web UI)
        shell: bash
        run: |
          go build -tags embedui -ldflags="-s -w" -o build/goclaw.exe .

      - name: Build portable wrapper
        shell: bash
        run: |
          cd cmd/desktop-portable
          go build -ldflags="-s -w" -o ../../build/goclaw-portable.exe .

      - name: Get latest pg0 version
        id: pg0ver
        shell: bash
        run: |
          TAG=$(curl -sL https://api.github.com/repos/vectorize-io/pg0/releases/latest | \
            grep '"tag_name"' | cut -d'"' -f4)
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache pg0
        id: cache-pg0
        uses: actions/cache@v4
        with:
          path: build/pg0.exe
          key: pg0-${{ steps.pg0ver.outputs.version }}

      - name: Cache Python embeddable (post-setup)
        id: cache-python
        uses: actions/cache@v4
        with:
          path: build/python
          key: python-embed-3.12.4

      - name: Cache uv
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: build/uv.exe
          key: uv-latest

      - name: Download pg0
        if: steps.cache-pg0.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L -o build/pg0.exe \
            "https://github.com/vectorize-io/pg0/releases/download/${{ steps.pg0ver.outputs.version }}/pg0-windows-x86_64.exe"

      - name: Download Python embeddable
        if: steps.cache-python.outputs.cache-hit != 'true'
        shell: bash
        run: |
          PY_VER="3.12.4"
          curl -sL -o build/python-embed.zip \
            "https://www.python.org/ftp/python/$PY_VER/python-$PY_VER-embed-amd64.zip"
          unzip -o build/python-embed.zip -d build/python/
          rm build/python-embed.zip

      - name: Setup Python embeddable (site + pip3 + python3 alias)
        if: steps.cache-python.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd build/python
          sed -i 's/^#import site/import site/' python312._pth
          cp python.exe python3.exe
          curl -sL -o get-pip.py https://bootstrap.pypa.io/get-pip.py
          ./python3.exe get-pip.py --no-warn-script-location
          rm get-pip.py

      - name: Download uv
        if: steps.cache-uv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sL -o build/uv.zip \
            https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip
          unzip -o build/uv.zip -d build/uv-tmp
          mv build/uv-tmp/uv.exe build/uv.exe
          rm -rf build/uv.zip build/uv-tmp

      - name: Copy migrations
        shell: bash
        run: cp -r migrations build/

      - name: Package portable zip
        shell: powershell
        run: |
          Compress-Archive -Path build\* -DestinationPath goclaw-portable-windows-amd64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: goclaw-portable-windows-amd64.zip
          tag_name: ${{ github.ref_name }}
          name: GoClaw Portable ${{ github.ref_name }} (Windows x64)
