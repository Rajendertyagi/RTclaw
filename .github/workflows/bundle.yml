name: Build GoClaw Standard Windows x64

on:
  push:
    tags:
      - 'standard-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. standard-v0.1.0)'
        required: true
        default: 'standard-v0.1.0'

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build GoClaw
        run: go build -ldflags="-s -w" -o goclaw.exe .

      - name: Verify build
        run: ls -la goclaw.exe

      - name: Download pg0 Windows binary
        run: |
          curl -L -o pg0.exe "https://github.com/vectorize-io/pg0/releases/download/v0.14.2/pg0-windows-x86_64.exe"

      - name: Package bundle
        run: |
          mkdir -p dist/goclaw-standard-windows-x64/migrations
          mkdir -p dist/goclaw-standard-windows-x64/scripts
          mkdir -p dist/goclaw-standard-windows-x64/data
          cp goclaw.exe dist/goclaw-standard-windows-x64/
          cp pg0.exe dist/goclaw-standard-windows-x64/
          cp -r migrations/* dist/goclaw-standard-windows-x64/migrations/
          cp scripts/start-standard.ps1 dist/goclaw-standard-windows-x64/start.ps1

      - name: Compress Bundle Archive
        shell: powershell
        run: |
          Compress-Archive -Path dist/goclaw-standard-windows-x64/* -DestinationPath goclaw-standard-windows-x64.zip

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: goclaw-standard-windows-x64.zip
          tag_name: ${{ steps.tag.outputs.tag }}
          name: GoClaw Standard ${{ steps.tag.outputs.tag }} (Windows x64)
          token: ${{ secrets.GITHUB_TOKEN }}
