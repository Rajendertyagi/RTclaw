name: Build GoClaw Standard Windows x64

on:
  push:
    tags:
      - 'standard-v*'
  workflow_dispatch:

env:
  POSTGRES_VERSION: "18.4-1"
  PGVECTOR_TAG: "v0.8.2"

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Enable Visual C++ Toolset
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build GoClaw
        run: make build

      - name: Cache PostgreSQL
        id: cache-postgres
        uses: actions/cache@v4
        with:
          path: pg18-windows
          key: pg${{ env.POSTGRES_VERSION }}-windows-x64

      - name: Download PostgreSQL Windows binaries
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          curl -L -o pg.zip "https://get.enterprisedb.com/postgresql/postgresql-${{ env.POSTGRES_VERSION }}-windows-x64-binaries.zip"
          unzip -q pg.zip
          mv pgsql pg18-windows
          rm pg.zip

      - name: Clone and build pgvector
        shell: cmd
        run: |
          set "PGROOT=%GITHUB_WORKSPACE%\pg18-windows"
          git clone --branch %PGVECTOR_TAG% https://github.com/pgvector/pgvector.git
          cd pgvector
          nmake /F Makefile.win
          nmake /F Makefile.win install

      - name: Package bundle
        run: |
          mkdir -p dist/goclaw-standard-windows-x64/pg
          mkdir -p dist/goclaw-standard-windows-x64/migrations
          cp goclaw.exe dist/goclaw-standard-windows-x64/
          cp -r pg18-windows/* dist/goclaw-standard-windows-x64/pg/
          cp -r migrations/* dist/goclaw-standard-windows-x64/migrations/
          cp scripts/start-standard.ps1 dist/goclaw-standard-windows-x64/start.ps1
          Compress-Archive -Path dist/goclaw-standard-windows-x64/* -DestinationPath goclaw-standard-windows-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: goclaw-standard-windows-x64.zip
          tag_name: ${{ github.ref_name }}
          name: GoClaw Standard ${{ github.ref_name }} (Windows x64)
